<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>داشبورد شخصی من</title>
<style>
  body{
    margin:0;
    font-family:tahoma;
    background:#f4f4f4;
  }
  .topbar{
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:10;
  }
  .menu-btn{
    background:none;
    border:none;
    font-size:26px;
    cursor:pointer;
    line-height:1;
    padding:4px 8px;
  }
  .topbar-title{
    font-size:16px;
    font-weight:bold;
    color:#333;
  }

  .overlay{
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,.4);
    z-index:20;
  }
  .overlay.show{
    display:block;
  }
  .side-panel{
    position:fixed;
    top:0;
    right:-280px;
    width:260px;
    height:100%;
    background:white;
    box-shadow:-2px 0 10px rgba(0,0,0,.2);
    transition:right .25s ease;
    z-index:30;
    padding:25px 20px;
    text-align:center;
  }
  .side-panel.show{
    right:0;
  }
  .side-panel img{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    box-shadow:0 0 10px rgba(0,0,0,.15);
    margin-bottom:12px;
  }
  .side-panel .name{
    font-size:17px;
    font-weight:bold;
    color:#333;
  }
  .side-panel .desc{
    font-size:14px;
    color:#777;
    margin-top:4px;
    margin-bottom:8px;
  }
  .side-panel .code{
    font-size:13px;
    color:#999;
    margin-bottom:25px;
  }
  .close-btn{
    position:absolute;
    top:14px;
    left:14px;
    background:none;
    border:none;
    font-size:22px;
    cursor:pointer;
    color:#888;
  }
  .logout{
    display:block;
    padding:10px;
    text-align:center;
    background:#e74c3c;
    color:white;
    border-radius:8px;
    text-decoration:none;
    font-size:14px;
  }

  .content{
    padding:20px;
  }
  h2{
    text-align:center;
  }
  .file-list{
    max-width:500px;
    margin:20px auto;
  }
  .file-item{
    background:white;
    padding:15px;
    margin-bottom:10px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .file-item a{
    text-decoration:none;
    color:#333;
    font-size:15px;
  }
  .file-item a:hover{
    color:#4CAF50;
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="menu-btn" onclick="togglePanel()">☰</button>
  <div class="topbar-title">داشبورد شخصی من</div>
</div>

<div class="overlay" id="overlay" onclick="togglePanel()"></div>

<div class="side-panel" id="sidePanel">
  <button class="close-btn" onclick="togglePanel()">✕</button>
  <img src="IMG_9286.jpeg" alt="عکس پروفایل" onerror="this.style.display='none'">
  <div class="name">صاحبه توسلی پور</div>
  <div class="desc">رشته تجربی</div>
  <div class="code">کد ملی: 1920503889</div>
  <a class="logout" href="index.html">خروج</a>
</div>

<div class="content">
  <h2>فایل‌های من</h2>
  <div class="file-list" id="fileList"></div>
</div>

<script>
  function togglePanel(){
    document.getElementById('sidePanel').classList.toggle('show');
    document.getElementById('overlay').classList.toggle('show');
  }

  const files = [
    { name: "کنکوریام ۰۳", url: "@konkooriam_03.pdf" }
  ];

  const list = document.getElementById('fileList');
  files.forEach(f => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `<a href="${f.url}" target="_blank">📄 ${f.name}</a>`;
    list.appendChild(item);
  });
</script>

</body>
</html>
