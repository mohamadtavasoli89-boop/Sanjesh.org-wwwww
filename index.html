<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد کاربری - سامانه سنجش</title>
<style>
  body {
    margin: 0;
    font-family: Tahoma, sans-serif;
    background-color: #f4f7f6;
    color: #333;
  }
  /* هدر بالای صفحه */
  header {
    background-color: #2193b0;
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  header h1 {
    margin: 0;
    font-size: 18px;
  }
  .logout-btn {
    background-color: #e74c3c;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-family: Tahoma, sans-serif;
    font-size: 13px;
  }
  .logout-btn:hover {
    background-color: #c0392b;
  }
  /* بدنه اصلی داشبورد */
  .container {
    max-width: 800px;
    margin: 20px auto;
    padding: 0 15px;
  }
  .welcome-card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    margin-bottom: 20px;
    border-right: 5px solid #2193b0;
  }
  .welcome-card h3 {
    margin-top: 0;
    color: #2193b0;
  }
  .info-box {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  .info-row:last-child {
    border-bottom: none;
  }
  .info-title {
    color: #666;
    font-weight: bold;
  }
  .info-value {
    color: #222;
  }
</style>
</head>
<body>

  <header>
    <h1>سامانه جامع آزمون‌های سراسری</h1>
    <button class="logout-btn" onclick="logout()">خروج از سامانه</button>
  </header>

  <div class="container">
    <div class="welcome-card">
      <h3>خوش آمدید</h3>
      <p>شما با موفقیت وارد حساب کاربری خود شده‌اید. از طریق این پنل می‌توانید وضعیت آزمون‌ها و اطلاعات ثبت‌نامی خود را مشاهده کنید.</p>
    </div>

    <div class="info-box">
      <div class="info-row">
        <span class="info-title">نام و نام خانوادگی:</span>
        <span class="info-value">داوطلب گرامی</span>
      </div>
      <div class="info-row">
        <span class="info-title">کد ملی:</span>
        <span class="info-value">1920503889</span>
      </div>
      <div class="info-row">
        <span class="info-title">وضعیت حساب:</span>
        <span class="info-value" style="color: #27ae60; font-weight: bold;">تایید شده و فعال</span>
      </div>
    </div>
  </div>

  <script>
    function logout() {
      // بازگشت به صفحه ورود
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
