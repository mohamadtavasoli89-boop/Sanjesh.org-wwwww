<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سراسری و دانشجو معلم - سامانه</title>
<style>
  body {
    margin: 0;
    font-family: Tahoma, sans-serif;
    background: #f4f7f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 15px;
    box-sizing: border-box;
  }

  /* هدر بالا شامل دکمه بازگشت به پنل اصلی */
  .header {
    width: 100%;
    max-width: 450px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 0 5px;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: #ffffff;
    border: 1px solid #3f51b5;
    color: #3f51b5;
    padding: 6px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    transition: background 0.2s;
  }

  .back-btn:hover {
    background: #e8eaf6;
  }

  .menu-icon {
    font-size: 20px;
    cursor: pointer;
    color: #333;
  }

  /* کارت‌های داخل پنل */
  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    margin-bottom: 15px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }

  /* خط رنگی بالای کارت‌ها */
  .card.blue-accent::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background-color: #3f51b5;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .card-title {
    font-size: 16px;
    font-weight: bold;
    color: #333;
  }

  .card-icon {
    font-size: 20px;
    color: #3f51b5;
  }

  .card-desc {
    font-size: 12px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 15px;
  }

  /* دکمه‌های ورود به بخش */
  .card-btn {
    display: block;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #3f51b5;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    font-family: Tahoma, sans-serif;
    box-sizing: border-box;
    transition: opacity 0.2s;
  }

  .card-btn:hover {
    opacity: 0.9;
  }

  /* فوتر پایین صفحه */
  .footer {
    text-align: center;
    font-size: 11px;
    color: #888;
    margin-top: 20px;
    line-height: 1.6;
    max-width: 450px;
  }
</style>
</head>
<body>

  <div class="header">
    <a href="dashboard.html" class="back-btn">
      <span style="font-size: 16px;">&rarr;</span>
      بازگشت
    </a>
    <div class="menu-icon">&#9776;</div>
  </div>

  <div class="card blue-accent">
    <div class="card-header">
      <span class="card-title">اعلام نتیجه رشته های دارای شرایط خاص</span>
      <span class="card-icon">&#9734;</span>
    </div>
    <div class="card-desc">
      نتایج رشته های شرایط خاص
    </div>
    <a href="#" class="card-btn">ورود به بخش &larr;</a>
  </div>

    <div class="card-header">
      <span class="card-title">نقطه قبولی</span>
